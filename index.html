<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">HSP & 고기능 ADHD 융합 자가 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .question-card { transition: transform 0.3s ease-in-out; }
        .question-card:hover { transform: translateY(-5px); }
        .result-card { background-color: #f9fafb; }
        .result-card h3, .result-card h4 { color: #1f2937; }
        .result-card p { color: #4b5563; }
        .btn-primary { background-color: #6366f1; color: white; transition: background-color 0.3s; }
        .btn-primary:hover { background-color: #4f46e5; }
        .btn-secondary { background-color: #6b7280; color: white; transition: background-color 0.3s; }
        .btn-secondary:hover { background-color: #4b5563; }
        input[type="radio"] {
            appearance: none; -webkit-appearance: none;
            width: 1.25rem; height: 1.25rem;
            border: 2px solid #9ca3af; border-radius: 50%;
            outline: none; cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        input[type="radio"]:checked { background-color: #6366f1; border-color: #6366f1; }
        input[type="radio"]:checked::after {
            content: ''; display: block;
            width: 0.625rem; height: 0.625rem; margin: 0.25rem;
            background-color: white; border-radius: 50%;
        }
        .scale-label { font-size: 0.75rem; }
        .share-button {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.75rem 1.5rem; font-weight: 600; border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.3s, box-shadow 0.3s; cursor: pointer;
        }
        .share-button:hover { box-shadow: 0 6px 8px rgba(0,0,0,0.15); }
        .share-generic { background-color: #6b7280; color: white; }
        .share-generic:hover { background-color: #4b5563; }
        .share-download { background-color: #10b981; color: white; }
        .share-download:hover { background-color: #059669; }
        .language-selector button {
            padding: 0.25rem 0.5rem; margin: 0 0.2rem; border-radius: 0.25rem;
            border: 1px solid #ccc; background-color: #eee; cursor: pointer; font-size: 0.8rem;
        }
        .language-selector button.active { background-color: #6366f1; color: white; border-color: #6366f1; }
        .section-divider {
            border-top: 3px dashed #d1d5db; margin: 2rem 0; padding-top: 1.5rem;
        }
        .test-type-label {
            display: inline-block; padding: 0.2rem 0.75rem; border-radius: 0.375rem;
            font-size: 0.75rem; font-weight: 700; margin-right: 0.5rem; vertical-align: middle;
        }
        .hsp-label { background-color: #dbeafe; color: #1e40af; }
        .adhd-label { background-color: #ede9fe; color: #5b21b6; }
        .part-label {
            display: inline-block; padding: 0.1rem 0.4rem; border-radius: 0.25rem;
            font-size: 0.65rem; font-weight: 700; margin-right: 0.3rem; vertical-align: middle;
        }
        .part-a { background-color: #fef3c7; color: #92400e; }
        .part-b { background-color: #e0e7ff; color: #3730a3; }
        .screener-positive { background-color: #fef2f2; border-color: #fca5a5; }
        .screener-negative { background-color: #f0fdf4; border-color: #86efac; }
        .hsp-result-card { border-left: 4px solid #3b82f6; }
        .adhd-result-card { border-left: 4px solid #8b5cf6; }
        .combined-card { border-left: 4px solid #6366f1; background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%); }
        .mbti-card { border-left: 4px solid #f59e0b; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fff7ed 100%); }
        .mbti-type-code { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.15em; background: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .mbti-dim-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; }
        .mbti-dim-label { font-size: 0.85rem; font-weight: 800; min-width: 1.5rem; text-align: center; }
        .mbti-dim-label.active { color: #f59e0b; }
        .mbti-dim-label.inactive { color: #d1d5db; }
        .mbti-dim-track { flex: 1; height: 1.4rem; background: #e5e7eb; border-radius: 0.7rem; overflow: hidden; position: relative; }
        .mbti-dim-fill { height: 100%; border-radius: 0.7rem; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: white; transition: width 0.6s ease; }
        .mbti-dim-fill.left-win { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .mbti-dim-fill.right-win { background: linear-gradient(270deg, #f59e0b, #fbbf24); margin-left: auto; }
        .mbti-dim-desc { font-size: 0.7rem; color: #6b7280; margin-top: 0.1rem; text-align: center; }
    </style>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-300 selection:text-indigo-900">

    <div class="container mx-auto max-w-3xl bg-white shadow-2xl rounded-xl p-6 md:p-10">
        <div class="language-selector text-right mb-4">
            <button data-lang="ko">한국어</button>
            <button data-lang="en">English</button>
            <button data-lang="fr">Français</button>
            <button data-lang="zh">简体中文</button>
            <button data-lang="ja">日本語</button>
        </div>

        <header class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-indigo-700 mb-2" data-i18n="mainTitle">HSP & 고기능 ADHD 융합 자가 테스트</h1>
            <p class="text-gray-600 text-sm md:text-base" data-i18n="subTitle">HSP-R (18문항) + ASRS-v1.1 (18문항) 통합 분석</p>
        </header>

        <div id="introduction" class="mb-8 p-4 bg-indigo-50 border border-indigo-200 rounded-lg">
            <h2 class="text-xl font-semibold text-indigo-600 mb-2" data-i18n="introHeader">테스트 안내</h2>
            <p class="text-gray-700 text-sm" data-i18n="introText"></p>
        </div>

        <form id="combinedTestForm">
            <!-- Unified Questions Section (HSP + ADHD shuffled, labels hidden) -->
            <div id="questionsSection">
                <div id="questionsContainer" class="space-y-6"></div>
            </div>

            <div class="mt-10 flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-4">
                <button type="button" id="submitButton" class="btn-primary font-semibold py-3 px-8 rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-opacity-75 w-full sm:w-auto" data-i18n="submitButton">결과 보기</button>
                <button type="button" id="restartButton" class="btn-secondary font-semibold py-3 px-8 rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-75 w-full sm:w-auto" style="display: none;" data-i18n="restartButton">다시 시작</button>
            </div>
        </form>

        <div id="resultsContainer" class="mt-10" style="display: none;">
            <h2 class="text-2xl md:text-3xl font-bold text-indigo-700 text-center mb-6" data-i18n="resultsHeader">통합 테스트 결과</h2>

            <!-- Combined Insight -->
            <div id="combinedInsight" class="combined-card result-card p-6 rounded-lg shadow-lg mb-8 border">
                <h3 class="text-xl font-bold text-indigo-700 mb-3" data-i18n="combinedHeader">🔍 통합 분석</h3>
                <p id="combinedText" class="text-base leading-relaxed"></p>
            </div>

            <!-- HSP Results -->
            <div class="hsp-result-card result-card p-6 rounded-lg shadow-lg mb-6 border border-blue-200">
                <h3 class="text-xl font-semibold text-blue-700 mb-2"><span class="test-type-label hsp-label">HSP</span> <span data-i18n="hspResultHeader">HSP 결과</span></h3>
                <p id="hspTotalScore" class="text-lg"></p>
                <p id="hspAverageScore" class="text-lg"></p>
                <p id="hspInterpretation" class="mt-2 text-base italic"></p>
            </div>
            <h4 class="text-lg font-semibold text-blue-600 mb-3 text-center" data-i18n="hspSubscaleHeader">HSP 하위 척도</h4>
            <div id="hspSubscaleResults" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>

            <!-- ADHD Results -->
            <div id="adhdScreenerResult" class="adhd-result-card result-card p-6 rounded-lg shadow-lg mb-6 border-2">
                <h3 class="text-xl font-semibold text-purple-700 mb-2"><span class="test-type-label adhd-label">ADHD</span> <span data-i18n="adhdScreenerHeader">Part A 선별 결과</span></h3>
                <p id="adhdScreenerScore" class="text-lg font-bold"></p>
                <p id="adhdScreenerInterp" class="mt-2 text-base italic"></p>
            </div>
            <div class="adhd-result-card result-card p-6 rounded-lg shadow-lg mb-6 border border-purple-200">
                <h3 class="text-xl font-semibold text-purple-700 mb-2"><span class="test-type-label adhd-label">ADHD</span> <span data-i18n="adhdTotalHeader">전체 응답 요약</span></h3>
                <p id="adhdTotalScore" class="text-lg"></p>
                <p id="adhdAverageScore" class="text-lg"></p>
            </div>
            <h4 class="text-lg font-semibold text-purple-600 mb-3 text-center" data-i18n="adhdSubscaleHeader">ADHD 하위 척도</h4>
            <div id="adhdSubscaleResults" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

            <!-- MBTI Estimated Results -->
            <div id="mbtiSection" class="mbti-card result-card p-6 rounded-lg shadow-lg mb-6 border border-amber-200 mt-8">
                <h3 class="text-xl font-bold text-amber-700 mb-1" data-i18n="mbtiHeader">🧩 MBTI 성격유형 추정</h3>
                <p class="text-xs text-gray-500 mb-4" data-i18n="mbtiSubtitle"></p>
                <div class="text-center my-4">
                    <span id="mbtiTypeCode" class="mbti-type-code"></span>
                    <p id="mbtiTypeName" class="text-lg font-semibold text-gray-700 mt-1"></p>
                </div>
                <div id="mbtiDimBars" class="my-4 px-2"></div>
                <p id="mbtiNoteText" class="text-xs text-gray-500 mt-4 italic text-center" data-i18n="mbtiNote"></p>
            </div>

            <div id="shareResults" class="mt-8 pt-6 border-t border-gray-200 text-center">
                <h3 class="text-xl font-semibold text-indigo-600 mb-4" data-i18n="shareHeader">결과 공유하기</h3>
                <div class="flex flex-wrap justify-center gap-4">
                    <button type="button" id="downloadImage" class="share-button share-download" style="display: none;" data-i18n="downloadImageButton">결과 이미지 다운로드</button>
                    <button type="button" id="shareGeneric" class="share-button share-generic" data-i18n="shareGenericButton">결과 공유하기</button>
                </div>
                <p class="text-sm text-gray-500 mt-4" data-i18n="shareNote"></p>
            </div>
        </div>

        <footer class="mt-12 pt-8 border-t border-gray-300 text-xs text-gray-500">
            <p class="mb-3 font-semibold text-gray-600" data-i18n="footerHspTitle"></p>
            <p class="mb-2" data-i18n="hspReference"></p>
            <p class="mb-2" data-i18n="hspCopyright"></p>
            <p class="mb-2" data-i18n="hspMoreInfo"></p>
            <p class="mb-4" data-i18n="hspContact"></p>
            <p class="mb-3 font-semibold text-gray-600" data-i18n="footerAdhdTitle"></p>
            <p class="mb-2" data-i18n="adhdReference"></p>
            <p class="mb-2" data-i18n="adhdCopyright"></p>
            <p class="mb-2" data-i18n="adhdPublicInterest"></p>
            <p class="mb-2" data-i18n="adhdMoreInfo"></p>
            <p class="mb-4" data-i18n="adhdContact"></p>
            <p class="mt-4 text-center" data-i18n="disclaimer"></p>
            <p class="mt-4 text-center text-gray-400" data-i18n="credits"></p>
            <div class="mt-4 pt-4 border-t border-gray-200 text-center">
                <p class="text-[0.65rem] text-gray-400">v1.1.0 — HSP-R source-aligned localization for 5 languages</p>
                <p class="text-[0.65rem] text-gray-400 mt-1">Developed by <strong>baesic</strong> · <a href="https://github.com/baesic/hsp" target="_blank" class="text-indigo-400 hover:underline">github.com/baesic/hsp</a></p>
            </div>
        </footer>
    </div>

                for (const key in hspSubscales) {
                    let score = 0;
                    hspSubscales[key].questionsIndices.forEach(qi => { score += lastHspAnswers[qi]; });
                    const avg = (score / hspSubscales[key].questionsIndices.length).toFixed(2);
                    const div = document.createElement('div');
                    div.className = 'result-card p-3 rounded-lg shadow-md border border-blue-100';
                    div.innerHTML = `<h4 class="text-sm font-semibold text-blue-700 mb-1">${t.hspSubscaleNames[key]}</h4>
                        <p class="text-xs">${t.hspSubscaleTotal.replace('{score}', score)}</p>
                        <p class="text-xs">${t.hspSubscaleAvg.replace('{score}', avg)}</p>`;
                    hspSubEl.appendChild(div);
                }
            }

            // Display ADHD Part A screener result
            const screenerEl = document.getElementById('adhdScreenerResult');
            document.getElementById('adhdScreenerScore').textContent = t.adhdScreenerScore.replace('{count}', lastScreenerCount);
            document.getElementById('adhdScreenerInterp').textContent = lastAdhdPositive ? t.adhdScreenerPositive : t.adhdScreenerNegative;
            screenerEl.className = lastAdhdPositive
                ? 'adhd-result-card result-card p-6 rounded-lg shadow-lg mb-6 border-2 screener-positive'
                : 'adhd-result-card result-card p-6 rounded-lg shadow-lg mb-6 border-2 screener-negative';

            // Display ADHD total summary
            const adhdAvg = (lastAdhdTotal / 18).toFixed(2);
            document.getElementById('adhdTotalScore').textContent = t.adhdTotalScore.replace('{score}', lastAdhdTotal);
            document.getElementById('adhdAverageScore').textContent = t.adhdAverageScore.replace('{score}', adhdAvg);

            // Display ADHD subscale breakdown
            const adhdSubEl = document.getElementById('adhdSubscaleResults');
            adhdSubEl.innerHTML = '';
            if (lastAdhdAnswers.length > 0) {
                for (const key in adhdSubscales) {
                    let score = 0;
                    adhdSubscales[key].questionsIndices.forEach(qi => { score += lastAdhdAnswers[qi]; });
                    const max = adhdSubscales[key].questionsIndices.length * 4;
                    const avg = (score / adhdSubscales[key].questionsIndices.length).toFixed(2);
                    const div = document.createElement('div');
                    div.className = 'result-card p-3 rounded-lg shadow-md border border-purple-100';
                    div.innerHTML = `<h4 class="text-sm font-semibold text-purple-700 mb-1">${t.adhdSubscaleNames[key]}</h4>
                        <p class="text-xs">${t.adhdSubscaleTotal.replace('{score}', score).replace('{max}', max)}</p>
                        <p class="text-xs">${t.adhdSubscaleAvg.replace('{score}', avg)}</p>`;
                    adhdSubEl.appendChild(div);
                }
            }
        }

        // ====================================================================
        // MBTI Estimation — HSP-R subscale mapping retained in v1.1.0
        // Based SOLELY on HSP-R personality/temperament responses.
        // ADHD clinical responses are intentionally excluded to prevent
        // any conflation between psychiatric symptoms and personality type.
        //
        // Each of the 6 HSP-R subscales maps to exactly one MBTI dimension
        // with ZERO index overlap between dimensions:
        //   Overstimulation           [2,8,14]     -> E/I
        //   Sensitivity to Details    [0,13,16]    -> S  (in S/N)
        //   Depth of Processing       [6,12,17]    -> N  (in S/N)
        //   Social Sensitivity        [3,7,10]     -> F  (in T/F, part 1)
        //   Emotional Reactivity      [1,5,9]      -> F  (in T/F, part 2)
        //   Positive Experiences      [4,11,15]    -> P  (in J/P)
        // ====================================================================
        function calculateMBTI(hspA, adhdA) {
            // Helper: compute average of selected question scores
            function avg(answers, indices) {
                if (!indices || indices.length === 0) return 0;
                return indices.reduce(function(s, i) { return s + answers[i]; }, 0) / indices.length;
            }

            // Normalize HSP answer (1-7 scale) to 0.0 ~ 1.0 range
            function norm(val) { return (val - 1) / 6; }

            // --- 1. E/I (Extraversion / Introversion) ---
            // Overstimulation subscale [Q3,Q9,Q15]: easily overwhelmed -> I
            // Inverse (comfortable with stimulation) -> E
            var overstim = norm(avg(hspA, [2, 8, 14]));
            var iPct = Math.round(overstim * 100);
            var ePct = 100 - iPct;

            // --- 2. S/N (Sensing / Intuition) ---
            // Detail Sensitivity subscale [Q1,Q14,Q17]: concrete sensory detection -> S
            // Depth of Processing subscale [Q7,Q13,Q18]: abstract/philosophical -> N
            var sScore = norm(avg(hspA, [0, 13, 16]));
            var nScore = norm(avg(hspA, [6, 12, 17]));
            var snSum = sScore + nScore;
            var sPct = snSum === 0 ? 50 : Math.round((sScore / snSum) * 100);
            var nPct = 100 - sPct;

            // --- 3. T/F (Thinking / Feeling) ---
            // Social Sensitivity [Q4,Q8,Q11] + Emotional Reactivity [Q2,Q6,Q10] -> F
            // Low empathic/emotional engagement -> T (inverse)
            var fScore = norm(avg(hspA, [1, 3, 5, 7, 9, 10]));
            var fPct = Math.round(fScore * 100);
            var tPct = 100 - fPct;

            // --- 4. J/P (Judging / Perceiving) ---
            // Positive Experience Sensitivity [Q5,Q12,Q16]: aesthetic openness,
            // spontaneous immersion in art/music -> P
            // Low aesthetic openness: practical, structure-preferring -> J (inverse)
            var pScore = norm(avg(hspA, [4, 11, 15]));
            var pPct = Math.round(pScore * 100);
            var jPct = 100 - pPct;

            var typeCode = (ePct > iPct ? 'E' : 'I') +
                           (sPct > nPct ? 'S' : 'N') +
                           (tPct > fPct ? 'T' : 'F') +
                           (jPct > pPct ? 'J' : 'P');

            // Tie-breaker: exact 50/50 defaults based on HSP population tendencies
            if (ePct === iPct) typeCode = 'I' + typeCode.substring(1);
            if (sPct === nPct) typeCode = typeCode.charAt(0) + 'N' + typeCode.substring(2);
            if (tPct === fPct) typeCode = typeCode.substring(0,2) + 'F' + typeCode.charAt(3);
            if (jPct === pPct) typeCode = typeCode.substring(0,3) + 'P';

            return {
                type: typeCode,
                dims: [
                    { left: 'E', right: 'I', leftPct: ePct, rightPct: iPct },
                    { left: 'S', right: 'N', leftPct: sPct, rightPct: nPct },
                    { left: 'T', right: 'F', leftPct: tPct, rightPct: fPct },
                    { left: 'J', right: 'P', leftPct: jPct, rightPct: pPct }
                ]
            };
        }

        function renderMBTI() {
            var t = translations[currentLang];
            if (!lastMbtiResult) return;
            document.getElementById('mbtiTypeCode').textContent = lastMbtiResult.type;
            document.getElementById('mbtiTypeName').textContent = t.mbtiTypes[lastMbtiResult.type] || '';
            var barsEl = document.getElementById('mbtiDimBars');
            barsEl.innerHTML = '';
            lastMbtiResult.dims.forEach(function(dim, idx) {
                var winner = dim.leftPct >= dim.rightPct ? dim.left : dim.right;
                var winPct = Math.max(dim.leftPct, dim.rightPct);
                var leftActive = dim.leftPct >= dim.rightPct;
                var row = document.createElement('div');
                row.className = 'mb-3';
                var dimLabel = t.mbtiDimNames[idx];
                var winDesc = t.mbtiLetterDesc[winner];
                var barHtml = '<div class="mbti-dim-row">';
                barHtml += '<span class="mbti-dim-label ' + (leftActive ? 'active' : 'inactive') + '">' + dim.left + '</span>';
                barHtml += '<div class="mbti-dim-track">';
                if (leftActive) {
                    barHtml += '<div class="mbti-dim-fill left-win" style="width:' + dim.leftPct + '%">' + dim.leftPct + '%</div>';
                } else {
                    barHtml += '<div class="mbti-dim-fill right-win" style="width:' + dim.rightPct + '%">' + dim.rightPct + '%</div>';
                }
                barHtml += '</div>';
                barHtml += '<span class="mbti-dim-label ' + (!leftActive ? 'active' : 'inactive') + '">' + dim.right + '</span>';
                barHtml += '</div>';
                barHtml += '<div class="mbti-dim-desc">' + dimLabel + ' — ' + winDesc + '</div>';
                row.innerHTML = barHtml;
                barsEl.appendChild(row);
            });
        }

        function calculateResults() {
            // Collect all answers from shuffled unified questions
            // and map back to original HSP/ADHD indices
            const hspAnswers = new Array(18);
            const adhdAnswers = new Array(18);
            for (let i = 0; i < 36; i++) {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                if (!sel) { alert(translations[currentLang].alertAllAnswered); return; }
                const val = parseInt(sel.value);
                if (shuffleMap[i].type === 'hsp') {
                    hspAnswers[shuffleMap[i].origIdx] = val;
                } else {
                    adhdAnswers[shuffleMap[i].origIdx] = val;
                }
            }

            lastHspAnswers = hspAnswers;
            lastAdhdAnswers = adhdAnswers;
            lastHspTotal = hspAnswers.reduce((a, b) => a + b, 0);
            lastAdhdTotal = adhdAnswers.reduce((a, b) => a + b, 0);
            lastHspIsHigh = (lastHspTotal / 18) > 5;

            let screenerCount = 0;
            for (let i = 0; i < 6; i++) {
                if (adhdAnswers[i] >= partAThresholds[i]) screenerCount++;
            }
            lastScreenerCount = screenerCount;
            lastAdhdPositive = screenerCount >= 4;
            lastMbtiResult = calculateMBTI(hspAnswers, adhdAnswers);

            updateResultsText();
            renderMBTI();

            resultsContainer.style.display = 'block';
            submitButton.style.display = 'none';
            restartButton.style.display = 'inline-block';

            const shareSection = document.getElementById('shareResults');
            if (shareSection) shareSection.style.display = 'none';
            html2canvas(resultsContainer, { scale: 2, logging: false, useCORS: true }).then(canvas => {
                if (shareSection) shareSection.style.display = '';
                canvas.toBlob(blob => {
                    resultImageBlob = blob;
                    downloadImageButton.style.display = 'inline-block';
                }, 'image/png');
            }).catch(() => {
                if (shareSection) shareSection.style.display = '';
            });

            window.scrollTo({ top: resultsContainer.offsetTop - 20, behavior: 'smooth' });
        }

        function restartTest() {
            document.getElementById('combinedTestForm').reset();
            resultsContainer.style.display = 'none';
            document.getElementById('hspSubscaleResults').innerHTML = '';
            document.getElementById('adhdSubscaleResults').innerHTML = '';
            submitButton.style.display = 'inline-block';
            restartButton.style.display = 'none';
            downloadImageButton.style.display = 'none';
            lastHspAnswers = []; lastAdhdAnswers = [];
            lastHspTotal = 0; lastAdhdTotal = 0;
            lastScreenerCount = 0; lastHspIsHigh = false; lastAdhdPositive = false;
            lastMbtiResult = null; resultImageBlob = null;
            document.getElementById('mbtiDimBars').innerHTML = '';
            document.getElementById('mbtiTypeCode').textContent = '';
            document.getElementById('mbtiTypeName').textContent = '';
            shuffleMap = null;
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadResultImage() {
            if (resultImageBlob) {
                const url = URL.createObjectURL(resultImageBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'hsp_adhd_combined_result.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                alert(translations[currentLang].alertNoImage);
            }
        }

        function shareGeneric() {
            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const url = `${baseUrl}?lang=${currentLang}`;
            const t = translations[currentLang];
            const hspAvg = (lastHspTotal / 18).toFixed(2);
            const mbtiText = lastMbtiResult ? ' | MBTI: ' + lastMbtiResult.type : '';
            const textSummary = `${t.mainTitle}\nHSP: ${lastHspTotal}/126 (avg ${hspAvg}) | ADHD Screener: ${lastScreenerCount}/6${mbtiText}`;
            const linkText = `\n\n${t.shareLinkText}${url}`;
            const title = t.pageTitle;

            if (navigator.share) {
                if (resultImageBlob) {
                    const filesArray = [new File([resultImageBlob], 'hsp_adhd_result.png', { type: 'image/png' })];
                    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                        navigator.share({ files: filesArray, title, text: textSummary + linkText })
                        .catch(() => navigator.share({ title, text: textSummary + linkText, url }).catch(() => {}));
                    } else {
                        navigator.share({ title, text: textSummary + linkText, url }).catch(() => {});
                    }
                } else {
                    navigator.share({ title, text: textSummary + linkText, url }).catch(() => {});
                }
            } else {
                const fallbackText = `${textSummary}${linkText}`;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(fallbackText).then(() => {
                        alert(t.alertCopied);
                    }).catch(() => {
                        prompt(t.alertCopyManual, fallbackText);
                    });
                } else {
                    prompt(t.alertCopyManual, fallbackText);
                }
            }
        }

        submitButton.addEventListener('click', calculateResults);
        restartButton.addEventListener('click', restartTest);
        shareGenericButton.addEventListener('click', shareGeneric);
        downloadImageButton.addEventListener('click', downloadResultImage);

        languageButtons.forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
        });

        setLanguage(currentLang);
    </script>
